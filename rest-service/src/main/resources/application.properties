server.port=8086

# Postgresql
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

# DDL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Отключить OSIV — LazyInitializationException будет виден явно, в сервисе
spring.jpa.open-in-view=false

jwt.issuer=feedbackbot-admin
jwt.secret=${JWT_SECRET}
jwt.access-token-minutes=15
# Must be set only for the first deployment. Delete it after POST /api/v1/auth/bootstrap succeeds.
app.auth.bootstrap-token=${APP_AUTH_BOOTSTRAP_TOKEN:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Logging
 logging.level.com.feedbackbot=DEBUG



